# Actualización automática mensual de datos (realidad.uy).
# Corre los scripts de ingesta reproducibles, valida, compila y commitea los
# archivos generados. Si Vercel está conectado al repo, el push redeploya solo.
#
# Qué actualiza: los indicadores mensuales del INE (IPC, ECH e IMS, leídos de
# sus informes técnicos), la esperanza de vida y el desempleo por departamento
# del INE, series del Banco Mundial, el PBI anual que publica
# PRISMA (ANII), el PIB trimestral y la cotización del dólar del BCU, tasas de
# seguridad (M. Interior) y resultados electorales (Corte Electoral; con asserts
# contra el escrutinio).
# Lo que no tiene script (pobreza, salario mínimo, datos departamentales) lo
# revisa la tarea local de Claude (día 5).

name: Actualizar datos

on:
  schedule:
    # Día 5 de cada mes, 13:00 UTC (10:00 en Uruguay).
    - cron: "0 13 5 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Los scripts importan módulos .ts (type-stripping nativo de Node ≥23.6).
          node-version: 24
          cache: npm

      - run: npm ci

      # Primero el INE: es lo único que cambia todos los meses. Si falla (el INE
      # cambió la redacción o gub.uy no responde), la corrida se corta acá y no
      # se publica nada a medias.
      - name: Ingesta INE (IPC, ECH e IMS, desde los informes técnicos)
        run: node scripts/ingest/fetch-ine.mjs

      # Esperanza de vida y desempleo por departamento: cambian una vez por año.
      # Si falla (por ejemplo, porque el INE cambió de certificado o de URL), la
      # corrida sigue con el archivo anterior.
      - name: Ingesta INE anual (esperanza de vida y desempleo por departamento)
        continue-on-error: true
        run: node scripts/ingest/fetch-ine-anuales.mjs

      - name: Ingesta Banco Mundial (series históricas)
        run: node scripts/ingest/fetch-worldbank.mjs

      # PRISMA cambia una vez por año y su API no está documentada. Si no responde
      # o cambió el formato, el paso queda en rojo pero la corrida sigue con el
      # archivo anterior: no frena la actualización del INE.
      - name: Ingesta PRISMA (PBI anual del BCU)
        continue-on-error: true
        run: node scripts/ingest/fetch-prisma.mjs

      # El BCU publica un trimestre nuevo en marzo, junio, setiembre y diciembre.
      # Mismo criterio que PRISMA: si falla (por ejemplo, porque el BCU cambió de
      # certificado), el paso queda en rojo y la corrida sigue con el archivo
      # anterior.
      - name: Ingesta BCU (PIB trimestral)
        continue-on-error: true
        run: node scripts/ingest/fetch-bcu-pib.mjs

      # Dólar: servicio web de cotizaciones del BCU. Mismo criterio: si falla,
      # queda el archivo anterior y la corrida sigue.
      - name: Ingesta BCU (cotización del dólar)
        continue-on-error: true
        run: node scripts/ingest/fetch-bcu-cotizaciones.mjs

      # El CSV de delitos pesa unos 160 MB y el servidor a veces corta la
      # descarga (pasó el 05/10/2026). Mismo criterio que PRISMA y el BCU: si
      # falla, la corrida sigue con el archivo anterior y no frena el IPC.
      - name: Ingesta seguridad (Ministerio del Interior)
        continue-on-error: true
        run: node scripts/ingest/fetch-seguridad.mjs

      - name: Ingesta elecciones (Corte Electoral, con verificación de totales)
        run: node scripts/ingest/fetch-elecciones.mjs

      - name: Validar datos
        run: npm run validate:data

      - name: Compilar
        run: npm run build

      - name: Commitear datos actualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/observations/ine-mensual.ts src/data/observations/ine-anuales.ts src/data/observations/series-banco-mundial.ts src/data/observations/prisma.ts src/data/observations/bcu-pib.ts src/data/observations/bcu-cotizaciones.ts src/data/observations/seguridad.ts src/data/elecciones-generadas.ts
          if git diff --cached --quiet; then
            echo "Sin cambios de datos este mes."
          else
            git commit -m "data: actualización automática mensual (INE, Banco Mundial, PRISMA, BCU, seguridad, elecciones)"
            # La tarea local de Claude también puede pushear el día 5. En el runner
            # quedan archivos versionados modificados que no se commitean (los
            # lista git status); --autostash los aparta para que git acepte rebasar.
            git status --short
            git pull --rebase --autostash origin main
            git push
          fi
